<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Youss Mass"/>
  <meta name="theme-color" content="#3b2a2a"/>
  <title>Youss Mass à Dom</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --cream: #f5efe6; --sand: #e8d9c4; --rose: #c97b6e; --deep: #3b2a2a; --warm: #8b5e52; --gold: #c4a46b; --green: #7a9e7e; --white: #ffffff; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body { background: var(--cream); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--deep); min-height: 100vh; padding-bottom: 90px; overscroll-behavior: none; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--deep); display: flex; border-top: 2px solid var(--gold); z-index: 200; padding-bottom: env(safe-area-inset-bottom); }
    .nav-tab { flex: 1; padding: 12px 0 10px; text-align: center; cursor: pointer; color: var(--warm); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; transition: color 0.2s; }
    .nav-tab .tab-icon { font-size: 1.4rem; display: block; margin-bottom: 3px; }
    .nav-tab.active { color: var(--gold); }
    .page { display: none; } .page.active { display: block; }
    .header { background: var(--deep); padding: 14px 16px 12px; position: sticky; top: 0; z-index: 100; }
    .header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .brand { font-size: 1.1rem; color: var(--cream); font-weight: 700; }
    .brand em { color: var(--gold); font-style: italic; }
    .today-btn { background: var(--rose); color: white; border: none; border-radius: 16px; padding: 5px 13px; font-size: 0.78rem; cursor: pointer; font-family: inherit; }
    .view-toggle { display: flex; gap: 6px; margin-bottom: 10px; }
    .view-btn { flex: 1; padding: 7px; border-radius: 10px; border: 1.5px solid rgba(196,164,107,0.3); background: rgba(255,255,255,0.08); color: var(--sand); font-size: 0.75rem; cursor: pointer; font-family: inherit; text-align: center; transition: all 0.2s; }
    .view-btn.active { background: var(--gold); color: var(--deep); border-color: var(--gold); font-weight: 700; }
    .week-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .nav-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(196,164,107,0.3); color: var(--gold); width: 32px; height: 32px; border-radius: 50%; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    #week-label { font-size: 0.82rem; color: var(--sand); text-align: center; flex: 1; }
    .stats { display: flex; gap: 8px; padding: 12px 14px 6px; }
    .stat { flex: 1; background: var(--white); border-radius: 12px; padding: 10px 6px; text-align: center; box-shadow: 0 2px 8px rgba(59,42,42,0.06); }
    .stat-val { font-size: 1.25rem; color: var(--rose); font-weight: 700; }
    .stat-lbl { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--warm); margin-top: 2px; }
    .stats-pay { display: flex; gap: 8px; padding: 0 14px 10px; }
    .stat-pay { flex: 1; border-radius: 12px; padding: 8px 6px; text-align: center; }
    .stat-pay.especes { background: #eaf3eb; }
    .stat-pay.virement { background: #e6eef8; }
    .stat-pay-val { font-size: 1.05rem; font-weight: 700; }
    .stat-pay.especes .stat-pay-val { color: var(--green); }
    .stat-pay.virement .stat-pay-val { color: #5b8ac9; }
    .stat-pay-lbl { font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--warm); margin-top: 1px; }
    .days-strip { display: flex; overflow-x: auto; gap: 7px; padding: 10px 14px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .days-strip::-webkit-scrollbar { display: none; }
    .day-pill { flex-shrink: 0; background: var(--white); border-radius: 14px; padding: 8px 12px; text-align: center; cursor: pointer; border: 2px solid transparent; box-shadow: 0 2px 8px rgba(59,42,42,0.06); min-width: 54px; transition: all 0.15s; }
    .day-pill.active { background: var(--deep); border-color: var(--gold); }
    .day-pill.today { border-color: var(--rose); }
    .day-pill.conge { background: #fbe8e6; border-color: var(--rose); }
    .day-pill.active.conge { background: #c0392b; border-color: #c0392b; }
    .day-pill .dname { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--warm); }
    .day-pill.active .dname { color: var(--sand); }
    .day-pill .dnum { font-size: 1.2rem; font-weight: 700; color: var(--deep); margin-top: 1px; }
    .day-pill.active .dnum { color: var(--gold); }
    .day-pill.today .dnum { color: var(--rose); }
    .day-pill.conge .dnum { color: var(--rose); }
    .day-pill.active.today .dnum { color: var(--gold); }
    .day-badge { width: 16px; height: 16px; background: var(--rose); border-radius: 50%; font-size: 0.55rem; color: white; display: flex; align-items: center; justify-content: center; margin: 3px auto 0; font-weight: 700; }
    .day-badge.hidden { visibility: hidden; }
    .day-title { font-size: 0.95rem; font-weight: 600; padding: 2px 16px 8px; font-style: italic; color: var(--warm); display: flex; align-items: center; justify-content: space-between; padding-right: 14px; }
    .btn-conge { font-size: 0.72rem; padding: 4px 10px; border-radius: 10px; border: none; cursor: pointer; font-family: inherit; font-weight: 700; }
    .btn-conge.off { background: #fbe8e6; color: var(--rose); }
    .btn-conge.on { background: var(--rose); color: white; }
    .conge-banner { background: #fbe8e6; border: 1.5px solid var(--rose); border-radius: 12px; margin: 0 14px 10px; padding: 12px 14px; text-align: center; color: var(--rose); font-weight: 700; font-size: 0.9rem; }
    .slots-list { padding: 0 14px; }
    .slot-item { display: flex; align-items: stretch; gap: 8px; margin-bottom: 5px; min-height: 48px; }
    .slot-time { font-size: 0.68rem; color: var(--warm); width: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end; font-weight: 600; }
    .slot-area { flex: 1; border-radius: 11px; min-height: 48px; cursor: pointer; position: relative; transition: background 0.15s; }
    .slot-area.empty { border: 1.5px dashed var(--sand); }
    .slot-area.empty:active { background: #fdf5ee; }
    .slot-area.blocked { background: var(--sand); opacity: 0.4; cursor: default; }
    .slot-area.travel { background: #f0e6d9; opacity: 0.6; cursor: default; border: 1.5px dashed var(--gold); }
    .slot-area.travel .travel-label { font-size: 0.65rem; color: var(--warm); display: flex; align-items: center; justify-content: center; height: 100%; font-style: italic; }
    .slot-area.conge-slot { background: #fbe8e6; opacity: 0.5; cursor: default; }
    .slot-add { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 1rem; color: var(--sand); }
    .rdv-card { border-radius: 11px; padding: 9px 13px; height: 100%; display: flex; flex-direction: column; justify-content: center; }
    .rdv-card.c-rose { background: #fbe8e6; border-left: 3px solid var(--rose); }
    .rdv-card.c-gold { background: #fdf3e3; border-left: 3px solid var(--gold); }
    .rdv-card.c-green { background: #eaf3eb; border-left: 3px solid var(--green); }
    .rdv-card.c-blue { background: #e6eef8; border-left: 3px solid #5b8ac9; }
    .rdv-card.c-purple { background: #f0e6f8; border-left: 3px solid #9b6bc9; }
    .rdv-name { font-weight: 700; font-size: 0.92rem; }
    .rdv-detail { font-size: 0.7rem; color: var(--warm); margin-top: 2px; }
    .rdv-actions { display: flex; gap: 6px; margin-top: 6px; }
    .btn-wa { background: #25d366; color: white; border: none; border-radius: 8px; padding: 5px 10px; font-size: 0.7rem; font-weight: 700; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 4px; }
    .fab { position: fixed; bottom: calc(70px + env(safe-area-inset-bottom)); right: 18px; width: 54px; height: 54px; background: var(--rose); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; box-shadow: 0 4px 16px rgba(201,123,110,0.45); cursor: pointer; z-index: 150; border: none; color: white; }
    .month-grid { padding: 0 14px 14px; }
    .month-days-header { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 4px; }
    .month-day-name { text-align: center; font-size: 0.6rem; text-transform: uppercase; color: var(--warm); font-weight: 700; padding: 4px 0; }
    .month-cells { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .month-cell { background: var(--white); border-radius: 10px; min-height: 52px; padding: 4px; cursor: pointer; border: 2px solid transparent; box-shadow: 0 1px 4px rgba(59,42,42,0.05); position: relative; transition: all 0.15s; }
    .month-cell.today { border-color: var(--rose); }
    .month-cell.selected { border-color: var(--gold); background: var(--deep); }
    .month-cell.other-month { opacity: 0.35; }
    .month-cell.conge { background: #fbe8e6; border-color: var(--rose); }
    .month-cell.conge.selected { background: #c0392b; border-color: #c0392b; }
    .month-cell .cell-num { font-size: 0.75rem; font-weight: 700; color: var(--deep); margin-bottom: 2px; }
    .month-cell.selected .cell-num { color: var(--gold); }
    .month-cell.today .cell-num { color: var(--rose); }
    .month-cell.conge .cell-num { color: var(--rose); }
    .month-cell.selected.today .cell-num { color: var(--gold); }
    .month-cell .cell-dots { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 2px; }
    .month-dot { width: 7px; height: 7px; border-radius: 50%; }
    .month-dot.c-rose { background: var(--rose); }
    .month-dot.c-gold { background: var(--gold); }
    .month-dot.c-green { background: var(--green); }
    .month-dot.c-blue { background: #5b8ac9; }
    .month-dot.c-purple { background: #9b6bc9; }
    .month-selected-day { padding: 8px 16px 4px; font-size: 0.9rem; font-style: italic; color: var(--warm); font-weight: 600; display: flex; align-items: center; justify-content: space-between; padding-right: 14px; }
    .month-rdv-list { padding: 0 14px; }
    .month-rdv-item { background: var(--white); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; box-shadow: 0 2px 8px rgba(59,42,42,0.06); cursor: pointer; }
    .month-rdv-top { display: flex; align-items: center; gap: 10px; }
    .month-rdv-time { font-size: 0.8rem; font-weight: 700; color: var(--rose); min-width: 38px; }
    .month-rdv-info { flex: 1; }
    .month-rdv-name { font-weight: 700; font-size: 0.9rem; }
    .month-rdv-detail { font-size: 0.7rem; color: var(--warm); margin-top: 2px; }
    .month-rdv-actions { margin-top: 8px; }
    .month-empty { text-align: center; padding: 20px; color: var(--warm); font-size: 0.85rem; font-style: italic; }
    .clientes-header { background: var(--deep); padding: 16px 16px 12px; position: sticky; top: 0; z-index: 100; }
    .clientes-header .brand { margin-bottom: 10px; display: block; }
    .search-bar { display: flex; align-items: center; background: rgba(255,255,255,0.1); border-radius: 12px; padding: 8px 14px; gap: 8px; }
    .search-bar input { background: none; border: none; outline: none; color: var(--cream); font-size: 0.9rem; flex: 1; font-family: inherit; }
    .search-bar input::placeholder { color: var(--warm); }
    .search-bar span { color: var(--warm); font-size: 1rem; }
    .clientes-list { padding: 12px 14px; }
    .cliente-card { background: var(--white); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 2px 10px rgba(59,42,42,0.07); cursor: pointer; border-left: 3px solid var(--gold); display: flex; align-items: center; gap: 12px; }
    .cliente-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--sand); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 700; color: var(--warm); flex-shrink: 0; }
    .cliente-info { flex: 1; }
    .cliente-name { font-weight: 700; font-size: 0.95rem; }
    .cliente-sub { font-size: 0.72rem; color: var(--warm); margin-top: 2px; }
    .cliente-badge { background: var(--sand); color: var(--warm); font-size: 0.65rem; padding: 3px 8px; border-radius: 10px; font-weight: 600; }
    .empty-state { text-align: center; padding: 50px 30px; color: var(--warm); }
    .empty-state .es-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state p { font-size: 0.9rem; line-height: 1.5; }
    .overlay { position: fixed; inset: 0; background: rgba(59,42,42,0.55); z-index: 300; display: none; align-items: flex-end; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .overlay.open { display: flex; }
    .modal { background: var(--cream); border-radius: 24px 24px 0 0; padding: 20px 18px calc(24px + env(safe-area-inset-bottom)); width: 100%; max-height: 90vh; overflow-y: auto; animation: slideUp 0.22s ease; }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-handle { width: 38px; height: 4px; background: var(--sand); border-radius: 2px; margin: 0 auto 16px; }
    .modal-title { font-size: 1.15rem; font-weight: 700; color: var(--deep); margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .close-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--warm); padding: 4px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--warm); margin-bottom: 4px; font-weight: 600; }
    input[type=text], input[type=tel], input[type=time], input[type=date], input[type=number], select, textarea { width: 100%; padding: 11px 14px; border: 1.5px solid var(--sand); border-radius: 12px; font-size: 1rem; color: var(--deep); background: var(--white); outline: none; font-family: inherit; -webkit-appearance: none; appearance: none; }
    textarea { resize: none; height: 70px; }
    input:focus, select:focus, textarea:focus { border-color: var(--rose); }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; }
    .btn-primary { width: 100%; background: var(--deep); color: var(--gold); border: none; border-radius: 13px; padding: 14px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 6px; font-family: inherit; }
    .btn-danger { width: 100%; background: none; color: var(--rose); border: 1.5px solid var(--rose); border-radius: 13px; padding: 11px; font-size: 0.9rem; cursor: pointer; margin-top: 8px; font-family: inherit; }
    .btn-whatsapp { width: 100%; background: #25d366; color: white; border: none; border-radius: 13px; padding: 12px; font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-top: 8px; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .checkbox-group { display: flex; align-items: center; gap: 10px; background: var(--white); border: 1.5px solid var(--sand); border-radius: 12px; padding: 11px 14px; }
    .checkbox-group input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--rose); cursor: pointer; }
    .checkbox-group span { font-size: 0.95rem; color: var(--deep); }
    .checkbox-group .prix-sup { margin-left: auto; font-weight: 700; color: var(--rose); font-size: 0.9rem; }
    .notif-banner { margin: 0 14px 10px; border-radius: 12px; padding: 10px 14px; font-size: 0.8rem; color: var(--deep); display: flex; align-items: center; gap: 8px; cursor: pointer; background: #eaf3eb; border: 1.5px solid var(--green); }
    .notif-banner.denied { background: #fbe8e6; border-color: var(--rose); cursor: default; }
    .notif-banner.ok { cursor: default; }
    .pay-toggle { display: flex; gap: 8px; }
    .pay-btn { flex: 1; padding: 11px; border-radius: 12px; border: 1.5px solid var(--sand); background: var(--white); color: var(--warm); font-size: 0.88rem; font-weight: 600; cursor: pointer; font-family: inherit; text-align: center; }
    .pay-btn.active { background: var(--deep); color: var(--gold); border-color: var(--deep); }
    .tip-badge { display: inline-block; background: #fdf3e3; color: var(--gold); font-size: 0.68rem; font-weight: 700; padding: 2px 7px; border-radius: 8px; margin-left: 4px; }
    .pay-badge { display: inline-block; font-size: 0.68rem; font-weight: 700; padding: 2px 7px; border-radius: 8px; margin-left: 4px; }
    .pay-badge.especes { background: #eaf3eb; color: var(--green); }
    .pay-badge.virement { background: #e6eef8; color: #5b8ac9; }
    .auto-badge { background: #fdf3e3; color: var(--gold); font-size: 0.6rem; padding: 2px 6px; border-radius: 6px; font-weight: 700; margin-left: 6px; }
  </style>
</head>
<body>
<div class="page active" id="page-planning">
  <div class="header">
    <div class="header-row">
      <div class="brand">🌸 Youss Mass <em>à Dom</em></div>
      <button class="today-btn" onclick="goToday()">Aujourd'hui</button>
    </div>
    <div class="view-toggle">
      <button class="view-btn active" id="btn-semaine" onclick="setView('semaine')">📅 Semaine</button>
      <button class="view-btn" id="btn-mois" onclick="setView('mois')">🗓 Mois</button>
    </div>
    <div class="week-nav">
      <button class="nav-btn" onclick="navPrev()">‹</button>
      <div id="week-label"></div>
      <button class="nav-btn" onclick="navNext()">›</button>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-val" id="s-rdv">0</div><div class="stat-lbl">RDV</div></div>
    <div class="stat"><div class="stat-val" id="s-ca">0€</div><div class="stat-lbl">Total</div></div>
    <div class="stat"><div class="stat-val" id="s-h">0h</div><div class="stat-lbl">Heures</div></div>
  </div>
  <div class="stats-pay">
    <div class="stat-pay especes"><div class="stat-pay-val" id="s-especes">0€</div><div class="stat-pay-lbl">💵 Espèces</div></div>
    <div class="stat-pay virement"><div class="stat-pay-val" id="s-virement">0€</div><div class="stat-pay-lbl">🏦 Virement</div></div>
  </div>
  <div id="notif-banner-wrap"></div>
  <div id="view-semaine">
    <div class="days-strip" id="days-strip"></div>
    <div class="day-title" id="day-title-wrap"></div>
    <div id="conge-banner-wrap"></div>
    <div class="slots-list" id="slots-list"></div>
  </div>
  <div id="view-mois" style="display:none">
    <div class="month-grid">
      <div class="month-days-header">
        <div class="month-day-name">Lun</div><div class="month-day-name">Mar</div><div class="month-day-name">Mer</div><div class="month-day-name">Jeu</div><div class="month-day-name">Ven</div><div class="month-day-name">Sam</div><div class="month-day-name">Dim</div>
      </div>
      <div class="month-cells" id="month-cells"></div>
    </div>
    <div class="month-selected-day" id="month-selected-day"></div>
    <div id="month-conge-banner"></div>
    <div class="month-rdv-list" id="month-rdv-list"></div>
  </div>
  <button class="fab" onclick="openRdvModal()">＋</button>
</div>
<div class="page" id="page-clientes">
  <div class="clientes-header">
    <span class="brand">👩 Mes Clientes</span>
    <div class="search-bar"><span>🔍</span><input type="text" id="search-input" placeholder="Rechercher une cliente..." oninput="filterClientes()"/></div>
  </div>
  <div class="clientes-list" id="clientes-list"></div>
  <button class="fab" onclick="openClienteModal()">＋</button>
</div>
<nav class="bottom-nav">
  <div class="nav-tab active" id="tab-planning" onclick="switchTab('planning')"><span class="tab-icon">📅</span>Planning</div>
  <div class="nav-tab" id="tab-clientes" onclick="switchTab('clientes')"><span class="tab-icon">👩</span>Clientes</div>
</nav>
<div class="overlay" id="overlay-rdv">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title"><span id="rdv-modal-title">Nouveau RDV</span><button class="close-btn" onclick="closeModal('overlay-rdv')">✕</button></div>
    <div class="form-group"><label>Prénom de la cliente</label><input type="text" id="f-name" placeholder="Ex : Sophie" oninput="autoFillFromCliente()"/></div>
    <div class="form-group"><label>📞 Téléphone</label><input type="tel" id="f-tel" placeholder="06 XX XX XX XX"/></div>
    <div class="form-row">
      <div class="form-group"><label>Date</label><input type="date" id="f-date"/></div>
      <div class="form-group"><label>Heure</label><input type="time" id="f-time" value="10:00"/></div>
    </div>
    <div class="form-group">
      <label>Prestation</label>
      <select id="f-prestation">
        <optgroup label="💆 Massage Classique">
          <option value="classic_30">Massage 30 min — 25€</option>
          <option value="classic_60" selected>Massage 1h — 40€</option>
          <option value="classic_90">Massage 1h30 — 55€</option>
          <option value="classic_120">Massage 2h — 80€</option>
        </optgroup>
        <optgroup label="🪨 Pierres Chaudes">
          <option value="pierres_60">Pierres chaudes 1h — 50€</option>
          <option value="pierres_90">Pierres chaudes 1h30 — 65€</option>
        </optgroup>
        <optgroup label="💧 Drainage Lymphatique">
          <option value="drainage_30">Drainage 1 zone 30min — 35€</option>
          <option value="drainage_75">Drainage corps entier 1h15 — 65€</option>
        </optgroup>
      </select>
    </div>
    <div class="form-group"><label>Déplacement</label><select id="f-dep" onchange="toggleKmField()"><option value="0">Non</option><option value="1">Oui</option></select></div>
    <div class="form-group" id="km-group" style="display:none">
      <label>Distance</label>
      <select id="f-km">
        <option value="10">Jusqu'à 30km — +10€</option>
        <option value="15">30 à 40km — +15€</option>
        <option value="20">Plus de 40km — +20€</option>
      </select>
    </div>
    <div class="form-group"><label>📍 Adresse complète</label><input type="text" id="f-adresse" placeholder="12 rue de la Paix, Pantin 93500"/></div>
    <div class="form-group"><label>📝 Détails accès</label><input type="text" id="f-details" placeholder="2ème étage, code 1234, sonner 2 fois..."/></div>
    <div class="form-group">
      <label>Supplément</label>
      <label class="checkbox-group">
        <input type="checkbox" id="f-prolongation"/>
        <span>⏱ Prolongation +20 min</span>
        <span class="prix-sup">+15€</span>
      </label>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>💰 Pourboire</label>
        <input type="number" id="f-pourboire" placeholder="0" min="0" step="1"/>
      </div>
      <div class="form-group">
        <label>💳 Paiement</label>
        <div class="pay-toggle">
          <button type="button" class="pay-btn active" id="pay-especes" onclick="setPayment('especes')">💵 Espèces</button>
          <button type="button" class="pay-btn" id="pay-virement" onclick="setPayment('virement')">🏦 Virement</button>
        </div>
      </div>
    </div>
    <button class="btn-primary" onclick="saveRdv()">✔ Enregistrer</button>
    <button class="btn-whatsapp" id="btn-wa-rappel" onclick="sendWaRappel()" style="display:none">📲 Envoyer rappel WhatsApp</button>
    <button class="btn-danger" id="btn-delete-rdv" onclick="deleteRdv()" style="display:none">🗑 Supprimer ce RDV</button>
  </div>
</div>
<div class="overlay" id="overlay-cliente">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title"><span id="cliente-modal-title">Nouvelle cliente</span><button class="close-btn" onclick="closeModal('overlay-cliente')">✕</button></div>
    <div class="form-row">
      <div class="form-group"><label>Prénom</label><input type="text" id="c-prenom" placeholder="Sophie"/></div>
      <div class="form-group"><label>Nom</label><input type="text" id="c-nom" placeholder="Martin"/></div>
    </div>
    <div class="form-group"><label>📞 Téléphone</label><input type="tel" id="c-tel" placeholder="06 XX XX XX XX"/></div>
    <div class="form-group"><label>📍 Adresse complète</label><input type="text" id="c-adresse" placeholder="12 rue de la Paix, Pantin 93500"/></div>
    <div class="form-group"><label>📝 Détails accès</label><input type="text" id="c-details" placeholder="2ème étage, code 1234, sonner 2 fois..."/></div>
    <div class="form-row">
      <div class="form-group"><label>Comment trouvée ?</label><select id="c-source"><option value="Instagram">Instagram</option><option value="TikTok">TikTok</option><option value="Bouche à oreille">Bouche à oreille</option><option value="WhatsApp">WhatsApp</option><option value="Autre">Autre</option></select></div>
      <div class="form-group"><label>Séances total</label><input type="text" id="c-seances" placeholder="0" value="0"/></div>
    </div>
    <div class="form-group"><label>Préférences / Notes</label><textarea id="c-notes" placeholder="Préférences de massage, infos importantes..."></textarea></div>
    <button class="btn-primary" onclick="saveCliente()">✔ Enregistrer</button>
    <button class="btn-danger" id="btn-delete-cliente" onclick="deleteCliente()" style="display:none">🗑 Supprimer cette cliente</button>
  </div>
</div>
<script>
const DB = {
  get: (k) => JSON.parse(localStorage.getItem('youss-' + k) || (k === 'rdvs' ? '{}' : k === 'conges' ? '[]' : '[]')),
  set: (k, v) => localStorage.setItem('youss-' + k, JSON.stringify(v))
};
const PRESTATIONS = {
  classic_30:  { label: 'Massage 30min',            duree: 30,  prix: 25, color: 'c-rose' },
  classic_60:  { label: 'Massage 1h',               duree: 60,  prix: 40, color: 'c-gold' },
  classic_90:  { label: 'Massage 1h30',             duree: 90,  prix: 55, color: 'c-green' },
  classic_120: { label: 'Massage 2h',               duree: 120, prix: 80, color: 'c-green' },
  pierres_60:  { label: 'Pierres chaudes 1h',       duree: 60,  prix: 50, color: 'c-blue' },
  pierres_90:  { label: 'Pierres chaudes 1h30',     duree: 90,  prix: 65, color: 'c-blue' },
  drainage_30: { label: 'Drainage 1 zone 30min',    duree: 30,  prix: 35, color: 'c-purple' },
  drainage_75: { label: 'Drainage corps 1h15',      duree: 75,  prix: 65, color: 'c-purple' },
};
const HOURS = [];
for (let h = 8; h <= 23; h++) { HOURS.push(`${String(h).padStart(2,'0')}:00`); if (h < 23) HOURS.push(`${String(h).padStart(2,'0')}:30`); }
const DAYS_SHORT = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const DAYS_LONG = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
let weekOffset = 0, monthOffset = 0;
let selectedDay = fmtDate(new Date());
let currentView = 'semaine';
let editingRdvKey = null, editingClienteId = null;
let currentRdvForWa = null;
let currentPayment = 'especes';

function fmtDate(d) { return d.toISOString().split('T')[0]; }
function getWeekDates(off) {
  const now = new Date(), day = now.getDay();
  const mon = new Date(now);
  mon.setDate(now.getDate() - (day===0?6:day-1) + off*7);
  return Array.from({length:7}, (_,i) => { const d=new Date(mon); d.setDate(mon.getDate()+i); return d; });
}
function rdvKey(date, time) { return date+'_'+time; }
function initials(prenom, nom) { return ((prenom||'?')[0]+(nom||'')[0]).toUpperCase(); }
function timeToMins(t) { const [h,m]=t.split(':').map(Number); return h*60+m; }
function minsToTime(m) { return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`; }
function isConge(date) { return DB.get('conges').includes(date); }
function toggleConge(date) {
  const conges = DB.get('conges');
  const idx = conges.indexOf(date);
  if (idx >= 0) conges.splice(idx, 1); else conges.push(date);
  DB.set('conges', conges);
  if (currentView === 'semaine') buildPlanning(); else buildMonth();
}
function setPayment(mode) {
  currentPayment = mode;
  document.getElementById('pay-especes').classList.toggle('active', mode === 'especes');
  document.getElementById('pay-virement').classList.toggle('active', mode === 'virement');
}
function toggleKmField() {
  document.getElementById('km-group').style.display = document.getElementById('f-dep').value === '1' ? 'block' : 'none';
}
function depPrix(r) { return r.dep ? (parseFloat(r.km)||10) : 0; }
function calcTotal(r, p) { return p.prix + depPrix(r) + (r.prolongation?15:0) + (parseFloat(r.pourboire)||0); }

// Auto-remplissage depuis le carnet clientes
function autoFillFromCliente() {
  const name = document.getElementById('f-name').value.trim().toLowerCase();
  if (!name) return;
  const clientes = DB.get('clientes');
  const match = clientes.find(c => c.prenom.toLowerCase() === name);
  if (match) {
    if (match.tel && !document.getElementById('f-tel').value) document.getElementById('f-tel').value = match.tel;
    if (match.adresse && !document.getElementById('f-adresse').value) document.getElementById('f-adresse').value = match.adresse;
    if (match.details && !document.getElementById('f-details').value) document.getElementById('f-details').value = match.details;
  }
}

// Mise à jour automatique du carnet clientes depuis un RDV
function syncClienteFromRdv(name, tel, adresse, details) {
  if (!name) return;
  const clientes = DB.get('clientes');
  const idx = clientes.findIndex(c => c.prenom.toLowerCase() === name.toLowerCase());
  if (idx >= 0) {
    if (tel) clientes[idx].tel = tel;
    if (adresse) clientes[idx].adresse = adresse;
    if (details) clientes[idx].details = details;
    clientes[idx].seances = (clientes[idx].seances || 0) + (editingRdvKey ? 0 : 1);
    DB.set('clientes', clientes);
  } else {
    clientes.push({ id: Date.now().toString(), prenom: name, nom: '', tel: tel||'', adresse: adresse||'', details: details||'', source: 'Planning', seances: 1, notes: '' });
    DB.set('clientes', clientes);
  }
}

function getBlockedSlots(rdvs) {
  const blocked = new Set(), travel = new Set();
  Object.entries(rdvs).forEach(([key,r]) => {
    const [date,time] = key.split('_');
    const p = PRESTATIONS[r.prestation]||{duree:60};
    const total = p.duree+(r.prolongation?20:0);
    const start = timeToMins(time);
    const slots = Math.ceil(total/30);
    for (let i=1; i<slots; i++) blocked.add(date+'_'+minsToTime(start+i*30));
    if (r.dep) {
      for (let i=1; i<=2; i++) { const t=minsToTime(start-i*30); if(start-i*30>=0) travel.add(date+'_'+t); }
      const end = start+slots*30;
      for (let i=0; i<2; i++) travel.add(date+'_'+minsToTime(end+i*30));
    }
  });
  return { blocked, travel };
}

function sendWaRappel() {
  if (!currentRdvForWa) return;
  const r = currentRdvForWa;
  const tel = r.tel ? r.tel.replace(/\s/g,'').replace(/^0/,'+33') : '';
  if (!tel) { alert('Pas de numéro de téléphone !'); return; }
  const p = PRESTATIONS[r.prestation]||{label:'massage'};
  const msg = `Bonjour ${r.name} 🌸\n\nJe vous rappelle votre rendez-vous demain à ${r.time} pour un ${p.label}.\n\nMerci de confirmer votre présence 🙏\n\nÀ demain ! 💛\nYouss Mass à Dom`;
  window.open('https://wa.me/'+tel+'?text='+encodeURIComponent(msg), '_blank');
}
function sendWaFromCard(key) { const r=DB.get('rdvs')[key]; if(!r||!r.tel) return; currentRdvForWa=r; sendWaRappel(); }

function showNotifBanner() {
  const wrap = document.getElementById('notif-banner-wrap');
  if (!('Notification' in window)) { wrap.innerHTML=''; return; }
  if (Notification.permission==='granted') wrap.innerHTML='<div class="notif-banner ok">🔔 Notifications activées</div>';
  else if (Notification.permission==='denied') wrap.innerHTML='<div class="notif-banner denied">🔕 Notifications bloquées</div>';
  else wrap.innerHTML='<div class="notif-banner" onclick="askNotif()">🔔 Activer les notifications RDV 👆</div>';
}
async function askNotif() { await Notification.requestPermission(); showNotifBanner(); scheduleAllNotifs(); }
function scheduleAllNotifs() {
  if (Notification.permission!=='granted') return;
  const rdvs=DB.get('rdvs'), now=Date.now();
  Object.entries(rdvs).forEach(([key,r]) => {
    const [date,time]=key.split('_');
    const delay=new Date(date+'T'+time+':00').getTime()-60*60*1000-now;
    if(delay>0&&delay<7*24*60*60*1000) setTimeout(()=>{const p=PRESTATIONS[r.prestation]; new Notification('🌸 RDV dans 1h',{body:`💆‍♀️ ${r.name} · ${p?p.label:'Massage'} à ${time}${r.tel?' · 📞 '+r.tel:''}${r.adresse?' · 📍 '+r.adresse:''}`});},delay);
  });
}

function setView(v) {
  currentView=v;
  document.getElementById('view-semaine').style.display=v==='semaine'?'block':'none';
  document.getElementById('view-mois').style.display=v==='mois'?'block':'none';
  document.getElementById('btn-semaine').classList.toggle('active',v==='semaine');
  document.getElementById('btn-mois').classList.toggle('active',v==='mois');
  if(v==='semaine') buildPlanning(); else buildMonth();
}
function navPrev() { if(currentView==='semaine'){weekOffset--;buildPlanning();}else{monthOffset--;buildMonth();} }
function navNext() { if(currentView==='semaine'){weekOffset++;buildPlanning();}else{monthOffset++;buildMonth();} }
function goToday() { weekOffset=0;monthOffset=0;selectedDay=fmtDate(new Date());if(currentView==='semaine')buildPlanning();else buildMonth(); }
function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
  if(tab==='clientes') renderClientes();
}
function updatePaymentStats(allRdvs) {
  let esp=0,vir=0;
  allRdvs.forEach(r=>{const p=PRESTATIONS[r.prestation]||{prix:40};const t=calcTotal(r,p);if(r.payment==='virement')vir+=t;else esp+=t;});
  document.getElementById('s-especes').textContent=esp+'€';
  document.getElementById('s-virement').textContent=vir+'€';
}

function buildPlanning() {
  const dates=getWeekDates(weekOffset), today=fmtDate(new Date());
  const s=dates[0],e=dates[6];
  document.getElementById('week-label').textContent=s.getDate()+' '+MONTHS[s.getMonth()]+' – '+e.getDate()+' '+MONTHS[e.getMonth()];
  const strip=document.getElementById('days-strip'); strip.innerHTML='';
  dates.forEach((d,i)=>{
    const ds=fmtDate(d),pill=document.createElement('div');
    const cng=isConge(ds);
    pill.className='day-pill'+(ds===selectedDay?' active':'')+(ds===today?' today':'')+(cng?' conge':'');
    const count=Object.keys(DB.get('rdvs')).filter(k=>k.startsWith(ds+'_')).length;
    pill.innerHTML=`<div class="dname">${DAYS_SHORT[i]}</div><div class="dnum">${d.getDate()}</div><div class="day-badge${count===0?' hidden':''}">${count}</div>`;
    pill.onclick=()=>{selectedDay=ds;buildPlanning();};
    strip.appendChild(pill);
  });
  const sel=new Date(selectedDay+'T12:00:00'),di=(sel.getDay()+6)%7;
  const cng=isConge(selectedDay);
  document.getElementById('day-title-wrap').innerHTML=`<span>${DAYS_LONG[di]} ${sel.getDate()} ${MONTHS[sel.getMonth()]}</span><button class="btn-conge ${cng?'on':'off'}" onclick="toggleConge('${selectedDay}')">${cng?'🏖 Retirer':'🏖 Congé'}</button>`;
  document.getElementById('conge-banner-wrap').innerHTML=cng?'<div class="conge-banner">🏖 Jour de congé</div>':'';
  const rdvs=DB.get('rdvs');
  const {blocked,travel}=getBlockedSlots(rdvs);
  const list=document.getElementById('slots-list'); list.innerHTML='';
  HOURS.forEach(h=>{
    const key=rdvKey(selectedDay,h),item=document.createElement('div');
    item.className='slot-item';
    const timeEl=document.createElement('div'); timeEl.className='slot-time'; timeEl.textContent=h;
    const area=document.createElement('div'); area.className='slot-area';
    if(rdvs[key]){
      const r=rdvs[key],p=PRESTATIONS[r.prestation]||{label:'Massage',prix:40,color:'c-gold'};
      area.className+=' has-rdv';
      const card=document.createElement('div'); card.className='rdv-card '+p.color;
      const total=calcTotal(r,p);
      const payB=r.payment==='virement'?'<span class="pay-badge virement">🏦 Virement</span>':'<span class="pay-badge especes">💵 Espèces</span>';
      const tipB=r.pourboire&&parseFloat(r.pourboire)>0?`<span class="tip-badge">💰 +${r.pourboire}€</span>`:'';
      card.innerHTML=`<div class="rdv-name">💆‍♀️ ${r.name}${r.tel?' · 📞 '+r.tel:''}</div><div class="rdv-detail">${p.label}${r.prolongation?' · ⏱+20min':''} · ${total}€${r.dep?' 🚗+'+depPrix(r)+'€':''}${r.adresse?' · 📍 '+r.adresse:''}</div>${r.details?`<div class="rdv-detail">📝 ${r.details}</div>`:''}<div style="margin-top:4px">${payB}${tipB}</div>${r.tel?`<div class="rdv-actions"><button class="btn-wa" onclick="event.stopPropagation();sendWaFromCard('${key}')">📲 Rappel WA</button></div>`:''}`;
      card.onclick=()=>openRdvModal(key);
      area.appendChild(card);
    } else if(cng){area.className+=' conge-slot';}
    else if(blocked.has(key)){area.className+=' blocked';}
    else if(travel.has(key)){area.className+=' travel';area.innerHTML='<div class="travel-label">🚗 Trajet</div>';}
    else{area.className+=' empty';area.innerHTML='<span class="slot-add">＋</span>';area.onclick=()=>openRdvModal(null,h);}
    item.appendChild(timeEl);item.appendChild(area);list.appendChild(item);
  });
  let count=0,ca=0,mins=0;const weekRdvs=[];
  dates.forEach(d=>{HOURS.forEach(h=>{const r=DB.get('rdvs')[rdvKey(fmtDate(d),h)];if(r){const p=PRESTATIONS[r.prestation]||{prix:40,duree:60};count++;ca+=calcTotal(r,p);mins+=p.duree+(r.prolongation?20:0);weekRdvs.push(r);}});});
  document.getElementById('s-rdv').textContent=count;
  document.getElementById('s-ca').textContent=ca+'€';
  const hh=Math.floor(mins/60),mm=mins%60;
  document.getElementById('s-h').textContent=hh>0?(mm>0?`${hh}h${mm}`:`${hh}h`):(mm+'min');
  updatePaymentStats(weekRdvs);
}

function buildMonth() {
  const now=new Date(),year=now.getFullYear(),month=now.getMonth()+monthOffset;
  const d=new Date(year,month,1);
  const mName=MONTHS[d.getMonth()]+' '+d.getFullYear();
  document.getElementById('week-label').textContent=mName.charAt(0).toUpperCase()+mName.slice(1);
  const firstDay=new Date(d.getFullYear(),d.getMonth(),1);
  const lastDay=new Date(d.getFullYear(),d.getMonth()+1,0);
  let startDow=firstDay.getDay();if(startDow===0)startDow=7;
  const cells=document.getElementById('month-cells');cells.innerHTML='';
  const rdvs=DB.get('rdvs'),today=fmtDate(new Date());
  for(let i=1;i<startDow;i++){const prev=new Date(d.getFullYear(),d.getMonth(),1-(startDow-i));const cell=document.createElement('div');cell.className='month-cell other-month';cell.innerHTML=`<div class="cell-num">${prev.getDate()}</div>`;cells.appendChild(cell);}
  for(let day=1;day<=lastDay.getDate();day++){
    const dd=new Date(d.getFullYear(),d.getMonth(),day),ds=fmtDate(dd);
    const cng=isConge(ds);
    const cell=document.createElement('div');
    cell.className='month-cell'+(ds===today?' today':'')+(ds===selectedDay?' selected':'')+(cng?' conge':'');
    const dayRdvs=Object.entries(rdvs).filter(([k])=>k.startsWith(ds+'_'));
    const dots=cng?'<div style="font-size:0.7rem">🏖</div>':dayRdvs.map(([,r])=>{const p=PRESTATIONS[r.prestation]||{color:'c-gold'};return`<div class="month-dot ${p.color}"></div>`;}).join('');
    cell.innerHTML=`<div class="cell-num">${day}</div><div class="cell-dots">${dots}</div>`;
    cell.onclick=()=>{selectedDay=ds;buildMonth();};
    cells.appendChild(cell);
  }
  const remaining=(7-cells.children.length%7)%7;
  for(let i=1;i<=remaining;i++){const cell=document.createElement('div');cell.className='month-cell other-month';cell.innerHTML=`<div class="cell-num">${i}</div>`;cells.appendChild(cell);}
  const sel=new Date(selectedDay+'T12:00:00'),di=(sel.getDay()+6)%7;
  const cng=isConge(selectedDay);
  document.getElementById('month-selected-day').innerHTML=`<span>${DAYS_LONG[di]} ${sel.getDate()} ${MONTHS[sel.getMonth()]}</span><button class="btn-conge ${cng?'on':'off'}" onclick="toggleConge('${selectedDay}')">${cng?'🏖 Retirer':'🏖 Congé'}</button>`;
  document.getElementById('month-conge-banner').innerHTML=cng?'<div class="conge-banner" style="margin:0 14px 10px">🏖 Jour de congé</div>':'';
  const dayRdvs=Object.entries(rdvs).filter(([k])=>k.startsWith(selectedDay+'_')).sort((a,b)=>a[0].localeCompare(b[0]));
  const rdvList=document.getElementById('month-rdv-list');
  if(dayRdvs.length===0){rdvList.innerHTML=cng?'':'<div class="month-empty">Aucun RDV ce jour</div>';}
  else{
    rdvList.innerHTML='';
    dayRdvs.forEach(([key,r])=>{
      const time=key.split('_')[1],p=PRESTATIONS[r.prestation]||{label:'Massage',prix:40,color:'c-gold'};
      const total=calcTotal(r,p);
      const payB=r.payment==='virement'?'<span class="pay-badge virement">🏦 Virement</span>':'<span class="pay-badge especes">💵 Espèces</span>';
      const tipB=r.pourboire&&parseFloat(r.pourboire)>0?`<span class="tip-badge">💰 +${r.pourboire}€</span>`:'';
      const item=document.createElement('div');item.className='month-rdv-item';
      item.innerHTML=`<div class="month-rdv-top"><div class="month-rdv-time">${time}</div><div class="month-rdv-info"><div class="month-rdv-name">💆‍♀️ ${r.name}${r.tel?' · 📞 '+r.tel:''}</div><div class="month-rdv-detail">${p.label} · ${total}€${r.dep?' 🚗+'+depPrix(r)+'€':''}${r.adresse?' · 📍 '+r.adresse:''}</div>${r.details?`<div class="month-rdv-detail">📝 ${r.details}</div>`:''}<div style="margin-top:4px">${payB}${tipB}</div></div></div>${r.tel?`<div class="month-rdv-actions"><button class="btn-wa" onclick="event.stopPropagation();sendWaFromCard('${key}')">📲 Rappel WA</button></div>`:''}`;
      item.onclick=()=>openRdvModal(key);
      rdvList.appendChild(item);
    });
  }
  let count=0,ca=0,mins=0;const allRdvs=Object.values(rdvs);
  allRdvs.forEach(r=>{const p=PRESTATIONS[r.prestation]||{prix:40,duree:60};count++;ca+=calcTotal(r,p);mins+=p.duree+(r.prolongation?20:0);});
  document.getElementById('s-rdv').textContent=count;
  document.getElementById('s-ca').textContent=ca+'€';
  const hh=Math.floor(mins/60),mm=mins%60;
  document.getElementById('s-h').textContent=hh>0?(mm>0?`${hh}h${mm}`:`${hh}h`):(mm+'min');
  updatePaymentStats(allRdvs);
}

function openRdvModal(key, defaultHour) {
  if(isConge(selectedDay)&&!key){alert('Jour de congé 🏖');return;}
  editingRdvKey=key||null;
  document.getElementById('rdv-modal-title').textContent=key?'✏️ Modifier le RDV':'➕ Nouveau RDV';
  document.getElementById('btn-delete-rdv').style.display=key?'block':'none';
  document.getElementById('btn-wa-rappel').style.display='none';
  currentRdvForWa=null;
  if(key&&DB.get('rdvs')[key]){
    const r=DB.get('rdvs')[key];
    currentRdvForWa=r;
    document.getElementById('f-name').value=r.name;
    document.getElementById('f-tel').value=r.tel||'';
    document.getElementById('f-date').value=key.split('_')[0];
    document.getElementById('f-time').value=r.time||key.split('_')[1];
    document.getElementById('f-prestation').value=r.prestation||'classic_60';
    document.getElementById('f-dep').value=r.dep?'1':'0';
    document.getElementById('f-km').value=r.km||'10';
    toggleKmField();
    document.getElementById('f-adresse').value=r.adresse||'';
    document.getElementById('f-details').value=r.details||'';
    document.getElementById('f-prolongation').checked=r.prolongation||false;
    document.getElementById('f-pourboire').value=r.pourboire||'';
    setPayment(r.payment||'especes');
    if(r.tel) document.getElementById('btn-wa-rappel').style.display='flex';
  } else {
    document.getElementById('f-name').value='';
    document.getElementById('f-tel').value='';
    document.getElementById('f-date').value=selectedDay;
    document.getElementById('f-time').value=defaultHour||'10:00';
    document.getElementById('f-prestation').value='classic_60';
    document.getElementById('f-dep').value='0';
    document.getElementById('f-km').value='10';
    toggleKmField();
    document.getElementById('f-adresse').value='';
    document.getElementById('f-details').value='';
    document.getElementById('f-prolongation').checked=false;
    document.getElementById('f-pourboire').value='';
    setPayment('especes');
  }
  openModal('overlay-rdv');
  setTimeout(()=>document.getElementById('f-name').focus(),300);
}

function saveRdv() {
  const name=document.getElementById('f-name').value.trim();
  if(!name){document.getElementById('f-name').focus();return;}
  const date=document.getElementById('f-date').value||selectedDay,time=document.getElementById('f-time').value;
  const newKey=rdvKey(date,time),rdvs=DB.get('rdvs');
  if(editingRdvKey&&editingRdvKey!==newKey) delete rdvs[editingRdvKey];
  const depOn=document.getElementById('f-dep').value==='1';
  const adresse=document.getElementById('f-adresse').value.trim();
  const details=document.getElementById('f-details').value.trim();
  const tel=document.getElementById('f-tel').value.trim();
  rdvs[newKey]={name,tel,time,prestation:document.getElementById('f-prestation').value,dep:depOn,km:depOn?document.getElementById('f-km').value:'10',adresse,details,prolongation:document.getElementById('f-prolongation').checked,pourboire:document.getElementById('f-pourboire').value||0,payment:currentPayment};
  DB.set('rdvs',rdvs);
  syncClienteFromRdv(name,tel,adresse,details);
  selectedDay=date;
  closeModal('overlay-rdv');
  if(currentView==='semaine')buildPlanning();else buildMonth();
  scheduleAllNotifs();
}

function deleteRdv() {
  if(!editingRdvKey) return;
  const rdvs=DB.get('rdvs');delete rdvs[editingRdvKey];DB.set('rdvs',rdvs);
  closeModal('overlay-rdv');
  if(currentView==='semaine')buildPlanning();else buildMonth();
}

function renderClientes(filter) {
  let clientes=DB.get('clientes');
  if(filter) clientes=clientes.filter(c=>(c.prenom+' '+c.nom).toLowerCase().includes(filter.toLowerCase()));
  const list=document.getElementById('clientes-list');list.innerHTML='';
  if(clientes.length===0){list.innerHTML=`<div class="empty-state"><div class="es-icon">👩</div><p>${filter?'Aucune cliente trouvée':'Pas encore de clientes !'}</p></div>`;return;}
  clientes.forEach(c=>{
    const card=document.createElement('div');card.className='cliente-card';
    card.innerHTML=`<div class="cliente-avatar">${initials(c.prenom,c.nom)}</div><div class="cliente-info"><div class="cliente-name">${c.prenom} ${c.nom||''}</div><div class="cliente-sub">${c.tel||''}${c.source?' · '+c.source:''}</div>${c.adresse?`<div class="cliente-sub">📍 ${c.adresse}</div>`:''} ${c.details?`<div class="cliente-sub">📝 ${c.details}</div>`:''} ${c.notes?`<div class="cliente-sub" style="font-style:italic">${c.notes.substring(0,50)}${c.notes.length>50?'...':''}</div>`:''}</div><div class="cliente-badge">${c.seances||0} séance${(c.seances||0)>1?'s':''}</div>`;
    card.onclick=()=>openClienteModal(c.id);list.appendChild(card);
  });
}

function filterClientes(){renderClientes(document.getElementById('search-input').value);}

function openClienteModal(id){
  editingClienteId=id||null;
  document.getElementById('cliente-modal-title').textContent=id?'✏️ Modifier':'➕ Nouvelle cliente';
  document.getElementById('btn-delete-cliente').style.display=id?'block':'none';
  if(id){const c=DB.get('clientes').find(x=>x.id===id);if(c){document.getElementById('c-prenom').value=c.prenom||'';document.getElementById('c-nom').value=c.nom||'';document.getElementById('c-tel').value=c.tel||'';document.getElementById('c-adresse').value=c.adresse||'';document.getElementById('c-details').value=c.details||'';document.getElementById('c-source').value=c.source||'Instagram';document.getElementById('c-seances').value=c.seances||0;document.getElementById('c-notes').value=c.notes||'';}}
  else{document.getElementById('c-prenom').value='';document.getElementById('c-nom').value='';document.getElementById('c-tel').value='';document.getElementById('c-adresse').value='';document.getElementById('c-details').value='';document.getElementById('c-source').value='Instagram';document.getElementById('c-seances').value='0';document.getElementById('c-notes').value='';}
  openModal('overlay-cliente');
  setTimeout(()=>document.getElementById('c-prenom').focus(),300);
}

function saveCliente(){
  const prenom=document.getElementById('c-prenom').value.trim();
  if(!prenom){document.getElementById('c-prenom').focus();return;}
  const clientes=DB.get('clientes');
  const data={id:editingClienteId||Date.now().toString(),prenom,nom:document.getElementById('c-nom').value.trim(),tel:document.getElementById('c-tel').value.trim(),adresse:document.getElementById('c-adresse').value.trim(),details:document.getElementById('c-details').value.trim(),source:document.getElementById('c-source').value,seances:parseInt(document.getElementById('c-seances').value)||0,notes:document.getElementById('c-notes').value.trim()};
  if(editingClienteId){const idx=clientes.findIndex(c=>c.id===editingClienteId);if(idx>=0)clientes[idx]=data;}else{clientes.push(data);}
  DB.set('clientes',clientes);closeModal('overlay-cliente');renderClientes();
}

function deleteCliente(){
  if(!editingClienteId) return;
  DB.set('clientes',DB.get('clientes').filter(c=>c.id!==editingClienteId));
  closeModal('overlay-cliente');renderClientes();
}

function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');editingRdvKey=null;editingClienteId=null;}
document.querySelectorAll('.overlay').forEach(o=>{o.addEventListener('click',function(e){if(e.target===this)closeModal(this.id);});});
showNotifBanner();
buildPlanning();
</script>
</body>
</html>
